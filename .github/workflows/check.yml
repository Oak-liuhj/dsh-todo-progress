name: Plugin checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm test
      - run: npm run check:release
      - run: mkdir -p dist && npm pack --ignore-scripts --pack-destination dist
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-todo-progress-package
          path: dist/*.tgz
          retention-days: 7
